spring.application.name=recon-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/recon}
spring.datasource.username=${DATABASE_USER:recon}
spring.datasource.password=${DATABASE_PASSWORD:localdevpassword}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=55MB
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
recon.max-rows=200000
