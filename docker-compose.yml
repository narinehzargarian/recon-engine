# PostgreSQL for the REST API. The password is only for this local container.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: recon
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 5s
      retries: 20
